<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>할머니의 레시피</title>
<style>
  :root { --tri: #7f9faa; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #fffdf8; overflow: hidden; }
  body { display: grid; place-items: center; }
  .book {
    container-type: inline-size;
    position: relative;
    width: min(100vw, calc(100dvh * 2223 / 1465));
    aspect-ratio: 2223 / 1465;
    touch-action: pan-y;
  }
  .book img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .book img.on { opacity: 1; }
  .nav {
    position: absolute; left: 1.5cqw; right: 1.5cqw; bottom: 1.5cqw;
    display: flex; justify-content: space-between;
    pointer-events: none;
  }
  .arrow {
    width: max(44px, 6cqw); height: max(44px, 6cqw);
    border: 0; padding: 0; background: none; cursor: pointer;
    display: grid; place-items: center;
    pointer-events: auto;
  }
  .arrow::before {
    content: ""; width: 0; height: 0;
    border-top: max(9px, 1.4cqw) solid transparent;
    border-bottom: max(9px, 1.4cqw) solid transparent;
    filter: drop-shadow(0 0 2px rgba(255, 255, 255, .9));
  }
  .arrow.prev::before { border-right: max(15px, 2.2cqw) solid var(--tri); }
  .arrow.next::before { border-left: max(15px, 2.2cqw) solid var(--tri); }
  .arrow:disabled { visibility: hidden; }
  .arrow:focus-visible { outline: 2px solid var(--tri); outline-offset: -4px; border-radius: 8px; }
  @media (prefers-reduced-motion: reduce) { .book img { transition: none; } }
</style>
</head>
<body>
<main class="book" aria-live="polite">
  <img class="on" src="images/cover.jpg" alt="할머니의 레시피 노트 표지">
  <img src="images/step1.jpg" alt="1. 사과 필링 만들기">
  <img src="images/step2.jpg" alt="2. 파이지 만들기">
  <img src="images/step3.jpg" alt="3. 파이 굽기">
  <img src="images/final.jpg" alt="마지막 장">

  <nav class="nav" aria-label="페이지 이동">
    <button class="arrow prev" aria-label="이전 페이지"></button>
    <button class="arrow next" aria-label="다음 페이지"></button>
  </nav>
</main>

<script>
  const pages = document.querySelectorAll(".book img");
  const prev = document.querySelector(".prev");
  const next = document.querySelector(".next");
  let i = 0;

  function show(n) {
    i = Math.max(0, Math.min(pages.length - 1, n));
    pages.forEach((p, k) => p.classList.toggle("on", k === i));
    prev.disabled = i === 0;
    next.disabled = i === pages.length - 1;
  }

  prev.addEventListener("click", () => show(i - 1));
  next.addEventListener("click", () => show(i + 1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") show(i - 1);
    if (e.key === "ArrowRight") show(i + 1);
  });

  let x0 = null;
  const book = document.querySelector(".book");
  book.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  book.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  show(0);
</script>
</body>
</html>
