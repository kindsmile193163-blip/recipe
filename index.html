<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할머니의 레시피</title>
<style>
  :root {
    --bg: #eef1f2;
    --tri: #8fb0bb;
    --tri-off: #cfdbe0;
    --dot: #cfdbe0;
    --dot-on: #e0a3ad;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px; padding: 16px;
  }
  .book {
    width: min(1000px, 100%, calc((100dvh - 110px) * 2223 / 1465));
    aspect-ratio: 2223 / 1465;
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 6px 22px rgba(60, 80, 90, .22);
    background: #fffdf8;
    touch-action: pan-y;
  }
  .book img {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    display: block;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
    user-select: none; -webkit-user-drag: none;
  }
  .book img.on { opacity: 1; }
  .nav { display: flex; align-items: center; gap: 28px; height: 48px; }
  .arrow {
    width: 48px; height: 48px; border: 0; padding: 0;
    background: none; cursor: pointer;
    display: grid; place-items: center;
  }
  .arrow::before {
    content: ""; width: 0; height: 0;
    border-top: 12px solid transparent; border-bottom: 12px solid transparent;
  }
  .arrow.prev::before { border-right: 19px solid var(--tri); }
  .arrow.next::before { border-left: 19px solid var(--tri); }
  .arrow:disabled { cursor: default; }
  .arrow.prev:disabled::before { border-right-color: var(--tri-off); }
  .arrow.next:disabled::before { border-left-color: var(--tri-off); }
  .arrow:focus-visible { outline: 2px solid var(--dot-on); outline-offset: 2px; border-radius: 8px; }
  .dots { display: flex; gap: 10px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--dot); }
  .dots i.on { background: var(--dot-on); }
  @media (prefers-reduced-motion: reduce) { .book img { transition: none; } }
  @media (prefers-color-scheme: dark) { :root { --bg: #2b3236; --tri-off: #44525a; --dot: #44525a; } }
</style>
</head>
<body>
<main class="book" aria-live="polite">
  <img class="on" src="images/cover.jpg" alt="할머니의 레시피 노트 표지">
  <img src="images/step1.jpg" alt="1. 사과 필링 만들기">
  <img src="images/step2.jpg" alt="2. 파이지 만들기">
  <img src="images/step3.jpg" alt="3. 파이 굽기">
</main>

<nav class="nav" aria-label="페이지 이동">
  <button class="arrow prev" aria-label="이전 페이지"></button>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <button class="arrow next" aria-label="다음 페이지"></button>
</nav>

<script>
  const pages = document.querySelectorAll(".book img");
  const dots = document.querySelectorAll(".dots i");
  const prev = document.querySelector(".prev");
  const next = document.querySelector(".next");
  let i = 0;

  function show(n) {
    i = Math.max(0, Math.min(pages.length - 1, n));
    pages.forEach((p, k) => p.classList.toggle("on", k === i));
    dots.forEach((d, k) => d.classList.toggle("on", k === i));
    prev.disabled = i === 0;
    next.disabled = i === pages.length - 1;
  }

  prev.addEventListener("click", () => show(i - 1));
  next.addEventListener("click", () => show(i + 1));
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") show(i - 1);
    if (e.key === "ArrowRight") show(i + 1);
  });

  let x0 = null;
  const book = document.querySelector(".book");
  book.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  book.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });

  show(0);
</script>
</body>
</html>
